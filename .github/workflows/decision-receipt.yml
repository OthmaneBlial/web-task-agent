name: Decision Receipt

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: OthmaneBlial/decision-receipt-action@v1
        with:
          path: examples/receipt-spec/minimal/receipt.json
          freshness-days: 0
