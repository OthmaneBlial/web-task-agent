name: Release tarball

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package (for a dry release rehearsal)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, verify, and publish the public tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Assert package version matches the release tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          test "v$(node -p "require('./package.json').version")" = "${RELEASE_TAG}"

      - name: Run release checks
        run: npm run release:check

      - name: Prove the first-success path from a clean tarball install
        run: node scripts/first-success.mjs

      - name: Build tarball and checksum
        run: |
          mkdir -p release
          npm pack --pack-destination release
          (cd release && sha256sum *.tgz > SHA256SUMS)

      - name: Attest the release tarball
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release/*.tgz"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release/* --clobber
          else
            gh release create "${RELEASE_TAG}" release/* \
              --verify-tag \
              --generate-notes \
              --title "Web Task Agent ${RELEASE_TAG}"
          fi
